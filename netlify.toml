[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Asset filenames are not content-hashed, so they must not be cached as
# immutable — an updated main.css or resume.pdf would stay stale for a year.
# Netlify's default (revalidate via ETag) handles CSS, JS and the PDF; images
# and icons rarely change, so let browsers keep them for a day.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[redirects]]
  from = "/resume"
  to = "/assets/resume.pdf"
  status = 302

# Old Next.js routes
[[redirects]]
  from = "/blogs"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blogs/*"
  to = "/blog/:splat/"
  status = 301
